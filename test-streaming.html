<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Search Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .stat {
            flex: 1;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .place-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .place-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        .place-title {
            font-weight: 600;
            color: #333;
            margin: 0 0 8px 0;
            font-size: 16px;
        }
        .place-category {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .place-rating {
            color: #ff9800;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .place-description {
            color: #666;
            font-size: 14px;
            line-height: 1.4;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .batch-indicator {
            background: #e8f5e9;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            color: #2e7d32;
            animation: pulse 0.5s;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Streaming Search Test</h1>
        <p>This demo shows real-time streaming of 150-200 places from Gemini API</p>
        
        <div class="search-form">
            <input type="text" id="city" placeholder="City (e.g., Tokyo, Paris, New York)" value="Tokyo">
            <input type="text" id="query" placeholder="What are you looking for? (e.g., coffee shops)" value="coffee shops">
            <button id="searchBtn" onclick="search()">Search</button>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="totalPlaces">0</div>
                <div class="stat-label">Total Places</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="batchCount">0</div>
                <div class="stat-label">Batches Received</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="elapsedTime">0s</div>
                <div class="stat-label">Elapsed Time</div>
            </div>
        </div>

        <div id="batchIndicator"></div>
        <div id="loading"></div>
        <div id="results" class="results"></div>
    </div>

    <script>
        let startTime;
        let timerInterval;

        async function search() {
            const city = document.getElementById('city').value;
            const query = document.getElementById('query').value;
            
            if (!city || !query) {
                alert('Please enter both city and query');
                return;
            }

            // Reset UI
            document.getElementById('results').innerHTML = '';
            document.getElementById('totalPlaces').textContent = '0';
            document.getElementById('batchCount').textContent = '0';
            document.getElementById('elapsedTime').textContent = '0s';
            document.getElementById('batchIndicator').innerHTML = '';
            document.getElementById('searchBtn').disabled = true;
            
            // Show loading
            document.getElementById('loading').innerHTML = `
                <div class="spinner"></div>
                <div class="loading">Searching for ${query} in ${city}...</div>
            `;

            // Start timer
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('elapsedTime').textContent = elapsed + 's';
            }, 100);

            try {
                const response = await fetch('http://localhost:3001/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ city, query })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            try {
                                const parsed = JSON.parse(data);
                                
                                if (parsed.error) {
                                    throw new Error(parsed.error);
                                }
                                
                                if (parsed.done) {
                                    clearInterval(timerInterval);
                                    document.getElementById('loading').innerHTML = '';
                                    document.getElementById('batchIndicator').innerHTML = 
                                        `<div class="batch-indicator">✅ Search Complete!</div>`;
                                    document.getElementById('searchBtn').disabled = false;
                                    return;
                                }
                                
                                if (parsed.results && Array.isArray(parsed.results)) {
                                    displayBatch(parsed.results, parsed.batchNumber);
                                }
                            } catch (e) {
                                console.error('Failed to parse SSE data:', e);
                            }
                        }
                    }
                }
            } catch (error) {
                clearInterval(timerInterval);
                document.getElementById('loading').innerHTML = `<div style="color: red;">Error: ${error.message}</div>`;
                document.getElementById('searchBtn').disabled = false;
            }
        }

        function displayBatch(places, batchNumber) {
            const resultsDiv = document.getElementById('results');
            const currentTotal = parseInt(document.getElementById('totalPlaces').textContent);
            
            // Update stats
            document.getElementById('totalPlaces').textContent = currentTotal + places.length;
            document.getElementById('batchCount').textContent = batchNumber;
            
            // Show batch indicator
            document.getElementById('batchIndicator').innerHTML = 
                `<div class="batch-indicator">📦 Batch ${batchNumber} received (${places.length} places)</div>`;

            // Add places
            places.forEach(place => {
                const card = document.createElement('div');
                card.className = 'place-card';
                card.innerHTML = `
                    <div class="place-category">${place.category || 'Other'}</div>
                    <h3 class="place-title">${place.title}</h3>
                    ${place.rating ? `<div class="place-rating">⭐ ${place.rating}/5.0</div>` : ''}
                    <div class="place-description">${place.description}</div>
                    ${place.lat && place.lng ? `<div style="font-size: 12px; color: #999; margin-top: 8px;">📍 ${place.lat.toFixed(4)}, ${place.lng.toFixed(4)}</div>` : ''}
                `;
                resultsDiv.appendChild(card);
            });
        }

        // Allow search on Enter key
        document.getElementById('query').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });
        document.getElementById('city').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });
    </script>
</body>
</html>
