
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripPlanner | AI Travel Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
          --brand-teal: #0d9488;
          --brand-teal-dark: #0f766e;
          --brand-sky: #0ea5e9;
          --brand-amber: #f59e0b;
          --surface: #ffffff;
          --bg: #f0fdf9;
        }

        * { box-sizing: border-box; }

        body { 
          font-family: 'Plus Jakarta Sans', sans-serif;
          background: linear-gradient(135deg, #f0fdf9 0%, #f8fafc 50%, #eff6ff 100%);
          background-attachment: fixed;
          min-height: 100vh;
          color: #0f172a;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass {
          background: rgba(255, 255, 255, 0.85);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .glass-dark {
          background: rgba(15, 23, 42, 0.85);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Destination card hover effect */
        .place-card-hover {
          transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .place-card-hover:hover {
          transform: translateY(-1px);
          box-shadow: 0 8px 24px -4px rgba(13, 148, 136, 0.15);
        }

        /* Typing dots animation */
        @keyframes dot-bounce {
          0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
          40% { transform: translateY(-6px); opacity: 1; }
        }
        .typing-dot {
          animation: dot-bounce 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.16s; }
        .typing-dot:nth-child(3) { animation-delay: 0.32s; }

        /* Gradient text */
        .gradient-text {
          background: linear-gradient(135deg, #0d9488, #0ea5e9);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        /* Subtle teal glow on active inputs */
        .input-glow:focus {
          box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        /* Smooth fade-in for chat messages */
        @keyframes fade-up {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .message-fade-in {
          animation: fade-up 0.25s ease forwards;
        }
    </style>

  }
}

</head>

</html>
